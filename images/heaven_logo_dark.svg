<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59822" />
      <stop offset="50%" stop-color="#A27814" />
      <stop offset="100%" stop-color="#735206" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGradDark)" stroke-width="3.5" />
    <circle cx="0" cy="0" r="43" fill="#2D160C" stroke="rgba(184, 134, 11, 0.4)" stroke-width="1" />
    
    <!-- Stylized "H" with cutlery motif -->
    <path d="M-22, -26 L-16, -26 L-16, 26 L-22, 26 Z" fill="#E6BB68" />
    <path d="M-24, -28 L-24, -18 M-19, -28 L-19, -18 M-14, -28 L-14, -18" stroke="#E6BB68" stroke-width="1.8" stroke-linecap="round" />
    <path d="M-18, -2 L18, -2 L18, 5 L-18, 5 Z" fill="#E6BB68" />
    <path d="M12, -26 L18, -26 L18, 26 L12, 26 Z" fill="#E6BB68" />
    <ellipse cx="15" cy="-24" rx="7" ry="9" fill="#E6BB68" />
  </g>

  <!-- Brand Typography in rich espresso for light cream background -->
  <g transform="translate(130, 48)">
    <text font-family="'Marcellus', 'Cinzel', serif" font-size="34" font-weight="700" letter-spacing="4" fill="#2D160C">
      HEAVEN
    </text>
    <text y="30" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" letter-spacing="7" fill="url(#goldGradDark)">
      LOUNGE &amp; BAR
    </text>
  </g>
</svg>
